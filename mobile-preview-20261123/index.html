const calc=()=>{const a=pick();return {need:a.reduce((s,g)=>s+g.need,0),done:a.reduce((s,g)=>s+g.done,0),backlog:a.reduce((s,g)=>s+g.ages.reduce((x,y)=>x+y,0),0),ages:[0,1,2,3].map(i=>a.reduce((s,g)=>s+g.ages[i],0))}};
const alertCount=a=>state.g?a.by[GDV.findIndex(g=>g.id===state.g)]:a.by.reduce((s,v)=>s+v,0);
const tc=t=>({red:"var(--red)",orange:"var(--orange)",amber:"var(--amber)",green:"var(--green)"}[t]||"var(--brand2)");
const sentence=(name,desc)=>'<div class="sectiontop"><h2>'+name+'</h2>'+(desc?'<span class="sub">'+desc+'</span>':'')+'</div>';
const info=(key)=>'<button class="infobtn" aria-label="Giải thích '+key+'" data-info="'+key+'">i</button>';
const pane=x=>'<section class="card">'+x+'</section>';
const risk=x=>x>130?'<span class="risk r">Vượt 130%</span>':x>=80?'<span class="risk o">80–130%</span>':'<span class="risk g">Dưới 80%</span>';
const kp=(name,value,sub,c,code)=>'<button class="kpi" style="--accent:'+c+'" data-detail="'+code+'"><small>'+name+'</small><strong>'+value+'</strong><span>'+sub+'</span></button>';
const ages=(arr)=>{let total=arr.reduce((a,b)=>a+b,0)||1;return '<div class="stack" role="group" aria-label="Phân bổ tuổi tồn">'+arr.map((n,i)=>'<button style="--accent:'+AGE_COLORS[i]+';width:'+(100*n/total)+'%" data-detail="age'+i+'" aria-label="'+AGE_NAMES[i]+': '+num(n)+' hồ sơ">'+(n/total>.095?num(n):'')+'</button>').join('')+'</div><div class="agegrid">'+arr.map((n,i)=>'<button class="agekey" data-detail="age'+i+'"><i class="swatch" style="--accent:'+AGE_COLORS[i]+'"></i><span>'+AGE_NAMES[i]+' <small>· '+num(n)+' ('+fmt(n/total*100)+'%)</small></span></button>').join('')+'</div>'};
const rank=(g)=>{let n=g.ages.reduce((s,a)=>s+a,0);return '<button class="rankrow" data-goto-gdv="'+g.id+'"><div class="rankhead" style="--gdv:'+g.color+'"><i class="id-dot"></i><span class="n">'+g.name+'</span><span class="mut">'+num(n)+' tồn</span><b>'+fmt(g.ratio)+'%</b>'+risk(g.ratio)+'</div><div class="threshold" style="--gdv:'+g.color+'"><span class="fill" style="width:'+Math.min(100,g.ratio/220*100)+'%"></span></div></button>'};
const spark=(arr)=>{let lo=Math.min(...arr),hi=Math.max(...arr),d=(hi-lo)||1;let p=arr.map((v,i)=>(3+i*15)+','+(25-(v-lo)/d*20)).join(' ');return '<svg class="spark" viewBox="0 0 82 28" role="img" aria-label="Xu hướng 6 kỳ"><polyline points="'+p+'"/></svg>'};
function trend(){const vals=state.g?null:[398,403,401,406,410,412];if(!vals)return pane('<div class="empty">Chuỗi theo từng GĐV chưa được cung cấp cho bản minh họa. Khi kết nối hệ thống thật, biểu đồ sẽ dùng kỳ báo cáo của GĐV đã chọn.</div>');const dates=["16/11","17/11","18/11","19/11","21/11","22/11"];const min=392,max=420;let p=vals.map((n,i)=>(28+i*56)+','+(123-(n-min)/(max-min)*92)).join(' ');return pane('<div class="figure"><svg viewBox="0 0 340 164" role="img" aria-label="Xu hướng hồ sơ tồn: '+vals.join(', ')+'"><line x1="18" y1="123" x2="330" y2="123" stroke="var(--line)"/><line x1="18" y1="31" x2="330" y2="31" stroke="var(--line)" stroke-dasharray="3 4"/><polyline points="'+p+'" fill="none" stroke="var(--brand2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+vals.map((n,i)=>{let x=28+i*56,y=123-(n-min)/(max-min)*92;return '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="var(--brand2)"/><text class="v" x="'+x+'" y="'+(y-10)+'" text-anchor="middle">'+n+'</text><text x="'+x+'" y="148" text-anchor="middle">'+dates[i]+'</text>'}).join('')+'</svg></div><p class="note">Chỉ 6 kỳ minh họa, không nội suy ngày 20/11. Trục 392–420 chỉ dùng để thấy biến động nhỏ, số liệu được gắn trực tiếp tại từng điểm.</p>')};
function alerts(){return ALERTS.map(a=>{let current=alertCount(a),delta=state.g?null:current-a.past;return '<button class="alert" data-detail="'+a.id+'" style="--accent:'+tc(a.tone)+'"><span class="bar"></span><span class="alname">'+a.name+'<span class="alsub" style="display:block">Theo dõi tiến độ xử lý</span></span><span class="delta '+(delta>0?'positive':delta<0?'negative':'')+'">'+(delta===null?'—':delta>0?'▲ '+delta:delta<0?'▼ '+Math.abs(delta):'= 0')+'</span><strong class="number">'+num(current)+'</strong></button>'}).join('')};
function overview(){const x=calc();return '<div class="kpis">'+kp('Cần giải quyết',num(x.need),'Hồ sơ trong phạm vi','#2784c6','need')+kp('Đã giải quyết',num(x.done),fmt(x.done/x.need*100)+'% tổng cần giải quyết','var(--green)','done')+kp('Đang tồn',num(x.backlog),'Chốt 22/11 · dữ liệu giả lập','var(--amber)','backlog')+kp('Tồn trên 90 ngày',num(x.ages[3]),fmt(x.ages[3]/x.backlog*100)+'% hồ sơ tồn','var(--red)','age3')+'</div><div class="split"><div>'+sentence('Cần xử lý hôm nay','7 nhóm cảnh báo')+pane(alerts()+'<p class="note">Các nhóm cảnh báo có thể giao nhau. Chạm vào một dòng để xem cấu trúc danh sách.</p>')+'</div><div>'+sentence('Cơ cấu tuổi tồn','Chốt 22/11/2026')+pane(ages(x.ages))+sentence('Xếp hạng GĐV', 'Tồn / HSPS TB tháng')+pane(pick().slice().sort((a,b)=>b.ratio-a.ratio).map(rank).join('')+'<div class="legendtext"><span>Ổn &lt;80%</span><span>Lưu ý 80–130%</span><span>Quá 130%</span></div><p class="note">Màu thanh dùng để định danh GĐV; vùng nền biểu thị ngưỡng đánh giá.</p>')+'</div></div><div class="split"><div>'+sentence('Xu hướng hồ sơ tồn','Ngày có báo cáo thực tế')+trend()+'</div><div>'+sentence('AI phân tích','Mở khi cần')+pane(['Chuyển nhóm 45–90 ngày cần giám sát','Điểm nghẽn bước TNDS','Theo dõi bảo lãnh kéo dài'].map((t,i)=>'<details class="insight"><summary><span style="color:'+tc(i===0?'orange':i===1?'red':'amber')+'">●</span>'+t+'</summary><div class="detail"><p><b>Căn cứ:</b> Ví dụ cấu trúc giải thích; chưa lấy dữ liệu AI thật.</p><p><b>Nhận định:</b> Cần kiểm tra hồ sơ nguồn trước khi kết luận.</p><p><b>Hành động:</b> Mở danh sách, giao GĐV xác minh nguyên nhân và thời hạn.</p><p><b>Theo dõi:</b> Đối chiếu ở kỳ dữ liệu tiếp theo.</p></div></details>').join(''))+'</div></div>'};
function gdv(){const a=pick();return '<div class="kpis">'+kp('GĐV trong phạm vi',a.length,'Đang hiển thị','var(--brand2)','gdv')+kp('Hồ sơ cần xử lý',num(calc().need),'Số giả lập','#2784c6','need')+kp('Đã giải quyết',num(calc().done),'Số giả lập','var(--green)','done')+kp('Hồ sơ tồn',num(calc().backlog),'Số giả lập','var(--amber)','backlog')+'</div>'+sentence('Tải việc theo GĐV','Chạm để lọc')+'<div class="split">'+a.map(g=>{let n=g.ages.reduce((s,x)=>s+x,0);return pane('<div class="gcard"><button class="linkrow title" style="padding:0 0 8px;--gdv:'+g.color+'" data-goto-gdv="'+g.id+'"><i class="id-dot"></i><b>'+g.name+'</b><span>'+fmt(g.ratio)+'% '+(g.ratio>130?'⚠':'')+'</span></button><div class="triple"><div><strong>'+num(g.need)+'</strong><span>Cần giải quyết</span></div><div><strong>'+num(g.done)+'</strong><span>Đã giải quyết</span></div><div><strong>'+num(n)+'</strong><span>Đang tồn</span></div></div>'+agesMini(g.ages)+'<p class="note">Màu tuổi tồn giữ nguyên giữa các GĐV, không dùng màu định danh để diễn giải rủi ro.</p></div>')}).join('')+'</div>'+sentence('So sánh tỷ lệ tồn','Ngưỡng 80% / 130%')+pane(a.slice().sort((x,y)=>y.ratio-x.ratio).map(rank).join(''))};
function agesMini(arr){let n=arr.reduce((s,x)=>s+x,0);return '<div class="ministack">'+arr.map((v,i)=>'<i style="--accent:'+AGE_COLORS[i]+';width:'+(100*v/n)+'%;background:'+AGE_COLORS[i]+'"></i>').join('')+'</div>'}
function ton(){const x=calc();return '<div class="kpis">'+kp('Tổng tồn',num(x.backlog),'22/11 · minh họa','var(--amber)','backlog')+kp('Tồn 45–90 ngày',num(x.ages[2]),fmt(x.ages[2]/x.backlog*100)+'% tồn','var(--orange)','age2')+kp('Tồn >90 ngày',num(x.ages[3]),fmt(x.ages[3]/x.backlog*100)+'% tồn','var(--red)','age3')+kp('Sức khỏe hồ sơ','640 / 900','Điểm giả lập','var(--green)','health')+'</div><div class="split"><div>'+sentence('Phân bổ tuổi tồn', 'Chốt 22/11')+pane(ages(x.ages))+sentence('Biến động giữa hai kỳ', 'Waterfall')+pane(state.g?'<p class="note">Cần chuỗi biến động thực của GĐV để tính waterfall theo bộ lọc.</p>':'<div class="waterfall"><button data-detail="flow" style="--accent:var(--brand2);height:69%">410</button><button data-detail="flow" style="--accent:var(--green);height:25%">+30</button><button data-detail="flow" style="--accent:var(--red);height:23%">−28</button><button data-detail="flow" style="--accent:var(--brand2);height:70%">412</button></div><div class="waterlabel"><span>Tồn đầu kỳ</span><span>Tiếp nhận</span><span>Giải quyết</span><span>Tồn cuối kỳ</span></div><p class="note">410 + 30 − 28 = 412. Cột biểu diễn các giá trị thành phần, không dùng chiều cao để cộng trực quan khi có chênh lệch quy mô.</p>')+'</div><div>'+sentence('Sức khỏe hồ sơ','Thang 0 / 450 / 900')+pane('<svg class="gauge" viewBox="0 0 300 170" role="img" aria-label="Sức khỏe hồ sơ minh họa 640 trên 900"><path d="M40 140 A110 110 0 0 1 260 140" fill="none" stroke="var(--line)" stroke-width="22" stroke-linecap="round"/><path d="M40 140 A110 110 0 0 1 260 140" fill="none" stroke="var(--green)" stroke-width="22" stroke-linecap="round" stroke-dasharray="246 346"/><text x="150" y="112" font-size="40" font-weight="850" text-anchor="middle">640</text><text class="minor" x="150" y="137" text-anchor="middle">/ 900 điểm · giả lập</text><text class="minor" x="34" y="166">0</text><text class="minor" x="150" y="24" text-anchor="middle">450</text><text class="minor" x="262" y="166" text-anchor="end">900</text></svg><p class="note">Điểm phải lấy từ công thức đang dùng trong production, không tính lại từ minh họa.</p>')+sentence('Xu hướng theo cảnh báo','6 kỳ giả lập')+pane(ALERTS.map(a=>'<button class="alert" data-detail="'+a.id+'" style="--accent:'+tc(a.tone)+'"><i class="bar"></i><span class="alname">'+a.name+'</span>'+spark(a.history)+'<strong class="number">'+alertCount(a)+'</strong></button>').join(''))+'</div></div>'};
function cost(){let a=pick(),avg=2.8;return sentence('Chi phí bình quân vụ nhỏ XO.4','Đơn vị: triệu đồng')+pane('<p class="note" style="margin-top:0">Dữ liệu giả lập để duyệt đồ họa. Vạch dọc = bình quân đơn vị 2,80 triệu đồng/vụ.</p>'+a.map(g=>'<button class="costrow" data-detail="cost" style="--gdv:'+g.color+'"><span class="topcost"><span>'+g.name+' · '+g.claims+' vụ</span><strong>'+fmt(g.avg)+' triệu</strong></span><div class="costtrack"><i style="width:'+(g.avg/5*100)+'%"></i></div></button>').join('')+'<div class="legendtext"><span>0 triệu</span><span>Vạch TB 2,80 triệu</span><span>5 triệu</span></div>')+sentence('Doanh thu theo nghiệp vụ','Minh họa biểu đồ 1')+pane(['XO.1','XO.2','XO.3','XO.4'].map((n,i)=>'<div class="statbar" style="--accent:var(--brand2)"><div class="head"><span>'+n+'</span><b>'+fmt([21.4,0.9,1.4,39.2][i])+' tỷ</b></div><div class="track"><i style="width:'+([21.4,0.9,1.4,39.2][i]/40*100)+'%"></i></div></div>').join('')+'<p class="note">Trục bắt đầu từ 0. Đây là doanh thu giả lập, không phải Dashboard 003.</p>')+sentence('Tỷ lệ bồi thường theo nghiệp vụ','Minh họa biểu đồ 2')+pane(['XO.1','XO.2','XO.3','XO.4'].map((n,i)=>'<div class="statbar" style="--accent:var(--orange)"><div class="head"><span>'+n+'</span><b>'+fmt([34.2,14.6,2.1,51.8][i])+'%</b></div><div class="track"><i style="width:'+([34.2,14.6,2.1,51.8][i])+'%"></i></div></div>').join('')+'<p class="note">Hai biểu đồ tách riêng để không dùng hai trục Y gây nhầm lẫn.</p>')};
function cl(){const t=calc();return '<div class="kpis">'+kp('Tổng hồ sơ tồn',num(t.backlog),'Mức hiện tại','var(--amber)','backlog')+kp('Trên 90 ngày',num(t.ages[3]),'Cần ưu tiên','var(--red)','age3')+'</div>'+sentence('Mục tiêu điều hành','Đề xuất · chưa phê duyệt')+pane([{name:'Giảm hồ sơ trên 90 ngày',now:t.ages[3],target:Math.round(t.ages[3]*.65)},{name:'Giảm tồn 45–90 ngày',now:t.ages[2],target:Math.round(t.ages[2]*.8)},{name:'Giảm tổng tồn',now:t.backlog,target:Math.round(t.backlog*.85)}].map(a=>'<div class="statbar" style="--accent:var(--brand2)"><div class="head"><span>'+a.name+'</span><b>'+num(a.now)+' → '+num(a.target)+'</b></div><div class="track"><i style="width:'+(a.target/a.now*100)+'%"></i></div></div>').join('')+'<p class="note">Các chỉ tiêu giả lập chỉ minh họa cách trình bày, không phải kế hoạch được giao.</p>')+sentence('Kế hoạch theo chu kỳ','Mở để xem')+pane(['Tuần · xử lý hồ sơ tồn lâu','Tháng · giảm tồn trung hạn','Quý · cải tiến quy trình và chất lượng'].map((t,i)=>'<details class="insight"><summary>'+t+'</summary><div class="detail"><p><b>Căn cứ:</b> Sử dụng dữ liệu đã đối soát trong hệ thống thật.</p><p><b>Trách nhiệm:</b> Người phụ trách nghiệp vụ xác nhận.</p><p><b>Kiểm chứng:</b> So sánh các kỳ báo cáo, lưu lịch sử cập nhật.</p></div></details>').join(''))};
function resultRecords(){let q=state.search.toLowerCase();return EXAMPLES.filter(x=>(!state.g||x.g===state.g)&&(!state.nv||x.nv===state.nv)&&(!q||(x.id+' '+x.status+' '+x.g).toLowerCase().includes(q)))}
function claims(){let a=resultRecords();return a.length?'<div class="resultlist">'+a.map(x=>'<button class="claim" data-claim="'+x.id+'"><div class="topclaim"><strong>'+x.id+'</strong><span class="risk '+(x.age>90?'r':x.age>=45?'o':'g')+'">'+x.age+' ngày</span></div><div class="rowclaim"><span>GĐV '+x.g+' · '+x.nv+'</span><span>'+x.status+'</span></div></button>').join('')+'</div>':'<div class="empty">Không có hồ sơ minh họa nào phù hợp bộ lọc.</div>'}
function tcpage(){return sentence('Tra cứu hồ sơ','10 hồ sơ giả lập')+pane('<div class="fieldset"><label class="all">Số hồ sơ / trạng thái<input id="quickSearch" placeholder="Ví dụ: DEMO-2601" value="'+state.search.replace(/"/g,'&quot;')+'"></label><label>Giám định viên<select id="quickG"><option value="">Tất cả GĐV</option>'+GDV.map(g=>'<option value="'+g.id+'" '+(state.g===g.id?'selected':'')+'>'+g.name+'</option>').join('')+'</select></label><label>Nghiệp vụ<select id="quickNV"><option value="">Tất cả</option><option value="XO.1" '+(state.nv==='XO.1'?'selected':'')+'>XO.1</option><option value="XO.4" '+(state.nv==='XO.4'?'selected':'')+'>XO.4</option></select></label></div><button class="primary full" id="doSearch">Lọc danh sách</button><p class="note">Bản thử nghiệm không có dữ liệu cá nhân, biển số thật, thanh toán hay xuất Excel.</p>')+sentence('Kết quả tìm kiếm','Danh sách thẻ · không cuộn ngang')+claims()};
function more(){return pane('<button class="linkrow" data-page="cl"><b>🛠 Cải tiến chất lượng dịch vụ</b><span>›</span></button><button class="linkrow" data-page="tc"><b>🔎 Tra cứu hồ sơ</b><span>›</span></button><button class="linkrow" data-page="admin"><b>⚙️ Quản trị hệ thống</b><span>›</span></button><button class="linkrow" id="printDemo"><b>🖨 In trang minh họa</b><span>›</span></button><button class="linkrow" id="themeMenu"><b>◐ Đổi chế độ sáng / tối</b><span>›</span></button><button class="linkrow" data-info="logout"><b>⎋ Đăng xuất</b><span>Không áp dụng ở demo</span></button>')};
function admin(){return pane('<h3 style="margin:0 0 7px">Giao diện Quản trị hệ thống</h3><p>Chỉ minh họa vị trí điều hướng. Không kết nối tài khoản, máy chủ, dữ liệu Drive, lịch Cron hoặc gửi email.</p><p class="note">Màn quản trị production hiện có phải được giữ nguyên quyền truy cập và kiểm thử độc lập trước khi chuyển giao.</p>')};
function subtitle(){return state.g?'Phạm vi: '+GDV.find(g=>g.id===state.g).name:'Toàn đơn vị · 6 GĐV giả lập'}
function render(){let main=document.getElementById('main'),p=state.page;const pages={overview,gdv,ton,cp:cost,cl,tc:tcpage,admin,more};let content=(pages[p]||overview)();main.innerHTML='<div class="banner"><strong>BẢN TEST GIAO DIỆN</strong> · Số và hồ sơ đều giả lập. Không kết nối Dashboard thật và không phải báo cáo nghiệp vụ.</div><div class="page-head"><div><h1>'+TITLES[p]+'</h1><p>'+subtitle()+'</p></div>'+(p==='overview'?'<button class="mutebtn" data-page="tc">Tra cứu ›</button>':'')+'</div><div class="chips"><span class="chip '+(!state.g?'active':'')+'">'+(state.g?GDV.find(g=>g.id===state.g).name:'Tất cả GĐV')+'</span>'+(state.nv?'<button class="chip active" id="clearNV">'+state.nv+' ✕</button>':'')+(state.g?'<button class="chip" id="clearG">Xóa lọc ✕</button>':'')+'<span class="chip">Chốt minh họa 22/11/2026</span></div>'+content+'<p class="footnote">PTI SOS 093 · Bản duyệt thiết kế ngày 23/11/2026 · Chưa dùng dữ liệu production.</p>';document.getElementById('pagetitle').textContent=TITLES[p];document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('on',el.dataset.page===p||(p==='cl'||p==='tc'||p==='admin')&&el.dataset.page==='more'));document.querySelectorAll('.navtab').forEach(el=>el.setAttribute('aria-current',el.classList.contains('on')?'page':'false'));document.getElementById('badgeCount').textContent=ALERTS.length; }

function setTheme(t){state.theme=t;localStorage.setItem("pti093-theme",t);document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';}
function openModal(title,body){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=body;document.getElementById('infoDialog').showModal()}
function openDetail(key){const a=ALERTS.find(v=>v.id===key),k=calc();if(a){let n=alertCount(a);return openModal(a.name,'<p><strong>'+num(n)+' hồ sơ giả lập</strong> thuộc cảnh báo trong phạm vi đang chọn.</p><p>Một hồ sơ có thể xuất hiện ở nhiều chỉ số. Trang test chỉ mô phỏng thao tác mở danh sách; cần kết nối hàm tra cứu hồ sơ đã tồn tại trong production để xem đầy đủ.</p><button class="primary full" data-modal-route="tc">Xem dạng danh sách minh họa</button>')}if(key.startsWith('age')){let i=Number(key[3]);return openModal(AGE_NAMES[i],'<p><strong>'+num(k.ages[i])+' hồ sơ giả lập</strong> trong nhóm tuổi tồn.</p><p>Ở bản production, chạm số sẽ gọi lại truy vấn hồ sơ tương ứng, bảo toàn điều kiện lọc và quyền truy cập.</p><button class="primary full" data-modal-route="tc">Mở mẫu danh sách hồ sơ</button>')}const explain={need:'Cần giải quyết = chuyển sang + phát sinh trong phạm vi đối soát; không cộng các kỳ trùng nhau.',done:'Đã giải quyết phải sử dụng đúng định nghĩa đang áp dụng trên Dashboard 093.',backlog:'Hồ sơ đang tồn được lấy từ trạng thái hợp lệ ở kỳ chốt; không suy ra từ trạng thái khác.',health:'Điểm sức khỏe chỉ là ví dụ cách trình bày. Không sửa công thức production.',flow:'Waterfall phải đối soát cùng phạm vi kỳ, không dùng tổng từ các kỳ khác.',cost:'So sánh chi phí phải giữ đúng mẫu số hồ sơ/vụ và thời gian áp dụng.',gdv:'GĐV và mã hồ sơ trong test đều ẩn danh.'};openModal('Giải thích chỉ số','<p>'+(explain[key]||'Mẫu giao diện, chưa lấy dữ liệu hệ thống thực.')+'</p><p>Đây không phải kết quả nghiệp vụ đã kiểm chứng.</p>')}
function openInfo(key){const m={age:'Bốn nhóm tuổi tồn không chồng lấn; phải tính tuổi đúng theo ngày chốt và chuẩn nghiệp vụ đang dùng.',ratio:'Tỷ lệ = hồ sơ tồn ÷ HS phát sinh trung bình tháng. Ngưỡng 80% và 130% lấy từ cấu hình khi tích hợp.',logout:'Bản test không đăng nhập và không có phiên làm việc để đăng xuất. Production phải dùng luồng đăng nhập/đăng xuất sẵn có.'};openModal('Thông tin thiết kế','<p>'+(m[key]||'Công thức giữ nguyên từ bản đang vận hành; phần này chỉ thay lớp hiển thị.')+'</p>')}
document.addEventListener('click',e=>{const v=e.target.closest('button');if(!v)return;
if(v.dataset.page){setPage(v.dataset.page);return}
if(v.dataset.gotoGdv){state.g=v.dataset.gotoGdv;setPage('gdv');return}
if(v.dataset.detail){openDetail(v.dataset.detail);return}
if(v.dataset.info){openInfo(v.dataset.info);return}
if(v.dataset.modalRoute){document.getElementById('infoDialog').close();setPage(v.dataset.modalRoute);return}
if(v.dataset.claim){let x=EXAMPLES.find(c=>c.id===v.dataset.claim);openModal('Hồ sơ '+x.id,'<p><strong>'+x.status+'</strong> · GĐV '+x.g+' · '+x.nv+'</p><p>Tuổi hồ sơ: '+x.age+' ngày.</p><p>Toàn bộ thông tin là giả lập. Bản chính sẽ mở màn chi tiết hồ sơ qua hàm hiện hành, không tải dữ liệu khách hàng sang trang thử nghiệm.</p>');return}
if(v.id==='filterBtn'){document.getElementById('selG').value=state.g;document.getElementById('selNV').value=state.nv;document.getElementById('filterDialog').showModal();return}
if(v.id==='closeFilter'){document.getElementById('filterDialog').close();return}
if(v.id==='applyFilter'){state.g=document.getElementById('selG').value;state.nv=document.getElementById('selNV').value;document.getElementById('filterDialog').close();render();return}
if(v.id==='resetFilter'){state.g='';state.nv='';state.search='';document.getElementById('filterDialog').close();render();return}
if(v.id==='clearNV'){state.nv='';render();return}
if(v.id==='clearG'){state.g='';render();return}
if(v.id==='closeInfo'){document.getElementById('infoDialog').close();return}
if(v.id==='bellBtn'){openModal('7 nhóm cảnh báo',ALERTS.map(a=>'<p><strong>'+a.name+'</strong>: '+num(alertCount(a))+' hồ sơ giả lập</p>').join(''));return}
if(v.id==='themeBtn'||v.id==='themeMenu'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');return}
if(v.id==='doSearch'){state.search=document.getElementById('quickSearch').value.trim();state.g=document.getElementById('quickG').value;state.nv=document.getElementById('quickNV').value;render();return}
if(v.id==='printDemo'){window.print();return}
});
document.getElementById('selG').innerHTML='<option value="">Tất cả GĐV</option>'+GDV.map(g=>'<option value="'+g.id+'">'+g.name+'</option>').join('');
document.getElementById('themeBtn').setAttribute('aria-label','Chuyển chế độ sáng tối');setTheme(state.theme);render();
</script></body></html>
